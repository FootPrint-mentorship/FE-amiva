<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Amiva OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Brand tokens mirror src/app/globals.css: indigo-900 #20185b, navy #131628,
     iris-600 accent, cyan-500 #57c7dc, soft #f4f5fb. Rendered at 1200×630 by
     scripts/make-og.mjs — this file is the single source for public/og.png. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(900px 500px at 15% -10%, #2a2178 0%, #20185b 45%, #131628 100%);
    color: #f4f5fb; position: relative;
  }
  .glow { position: absolute; right: -120px; bottom: -220px; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(87,199,220,0.35) 0%, rgba(87,199,220,0) 65%); }
  .frame { position: relative; z-index: 1; padding: 64px 72px; height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 40px; display: block; }
  h1 { margin: 0; font-size: 72px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 800; max-width: 980px; }
  .pill { display: inline-block; background: #6a5ae0; color: #fff; border-radius: 22px; padding: 2px 22px 8px; margin-top: 10px; }
  p { margin: 22px 0 0; font-size: 28px; line-height: 1.35; color: rgba(244,245,251,0.78); max-width: 860px; font-weight: 500; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: rgba(244,245,251,0.7); font-weight: 600; }
  .foot .url { color: #9adeeb; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame">
    <div class="brand"><img src="../public/brand/wordmark-white.svg" alt="Amiva" /></div>
    <div>
      <h1>Reminders that reach you,<br /><span class="pill">on WhatsApp.</span></h1>
      <p>Tell Amiva what to remind you about and when. It messages you on time. Calendar, tasks and memory live in the same chat.</p>
    </div>
    <div class="foot"><span>Free to start · No app to install</span><span class="url">tryamiva.com</span></div>
  </div>
</body>
</html>
